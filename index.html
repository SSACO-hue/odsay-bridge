<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>G2 길안내 연결 페이지</title>
  </head>
  <body>
    <p>G2 길안내 앱이 대중교통 정보를 받을 때 쓰는 연결 페이지입니다. 직접 여는 용도가 아닙니다.</p>
    <script>
      // What this page does, and nothing else:
      //   the G2 길안내 plugin (running on the phone at http://127.0.0.1:<port>) loads this page in a
      //   hidden frame and asks it to fetch one ODsay API address; the answer is handed back.
      // Why: ODsay accepts a key only from registered page addresses, and the plugin's own address
      // changes its port every start. This page's address is fixed.
      // No key is stored here: the plugin sends the full address (with its key) each time, and this
      // page keeps nothing.
      var API_PREFIX = 'https://api.odsay.com/v1/api/';

      function isPlugin(origin) {
        try {
          var u = new URL(origin);
          return u.protocol === 'http:' && (u.hostname === '127.0.0.1' || u.hostname === 'localhost');
        } catch (e) {
          return false;
        }
      }

      window.addEventListener('message', function (event) {
        if (!isPlugin(event.origin)) return;
        var m = event.data;
        if (!m || m.type !== 'g2nav-odsay' || typeof m.id !== 'number' || typeof m.url !== 'string') return;
        function reply(extra) {
          extra.type = 'g2nav-odsay-reply';
          extra.id = m.id;
          event.source.postMessage(extra, event.origin);
        }
        // Only ODsay's API may be fetched through this page.
        if (m.url.indexOf(API_PREFIX) !== 0) {
          reply({ ok: false, error: 'address not allowed' });
          return;
        }
        fetch(m.url, { credentials: 'omit', cache: 'no-store' })
          .then(function (res) {
            return res.text().then(function (body) {
              reply({ ok: true, status: res.status, body: body });
            });
          })
          .catch(function (err) {
            reply({ ok: false, error: String(err) });
          });
      });

      if (window.parent !== window) window.parent.postMessage({ type: 'g2nav-odsay-ready' }, '*');
    </script>
  </body>
</html>
